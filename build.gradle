plugins {
    id 'com.android.library' version '9.4.1'
    id 'maven-publish'
}

group 'com.reandroid'

version '1.4.0'

android {
    namespace 'com.reandroid.arsclib'
    compileSdk 37

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.12'
}

tasks.matching { it.name ==~ /process.*JavaRes/ }.configureEach {
    inputs.property('version', version)
    filesMatching('arsclib.properties') {
        expand('version': version)
    }
}

// Consumed by JitPack via publishToMavenLocal; components.release only exists after AGP evaluates
publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate { from components.release }
        }
    }
}
